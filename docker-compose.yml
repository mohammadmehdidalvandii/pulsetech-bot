services:
  pulsetech-postgres:
    image: postgres:16-alpine
    container_name: pulsetech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pulsetech_pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pulsetech-internal
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pulsetech-bot:
    build: .
    container_name: pulsetech-bot
    restart: unless-stopped
    depends_on:
      pulsetech-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN}
      DB_HOST: pulsetech-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      INTERNAL_API_PORT: 3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks:
      - pulsetech-internal
      - proxy

volumes:
  pulsetech_pgdata:

networks:
  pulsetech-internal:
    driver: bridge
  proxy:
    external: true